version: '3.8'

services:
  db:
    image: postgres:16
    container_name: orderapi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: orderapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: orderapi
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=orderapi;Username=postgres;Password=postgres123
      - Jwt__Key=chave-secreta-super-segura-minimo-32-chars!!
      - Jwt__Issuer=OrderApi
      - Jwt__Audience=OrderApi
    ports:
      - "8080:8080"

volumes:
  pgdata: